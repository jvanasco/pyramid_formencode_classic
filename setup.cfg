[metadata]
name = pyramid_formencode_classic
author = Jonathan Vanasco
author_email = jonathan@findmeon.com
version = attr: pyramid_formencode_classic.__VERSION__
url = https://github.com/jvanasco/pyramid_formencode_classic
description = An implementation of the classic Pylons formencode validation, for Pyramid.
long_description = file: README.md
long_description_content_type = text/markdown
license = BSD
classifiers =
    Intended Audience :: Developers
    Framework :: Pyramid
    Programming Language :: Python
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.7
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Programming Language :: Python :: 3.14

[options]
packages = find:
package_dir =
    = src
zip_safe = False
install_requires =
    pyramid
    formencode>=2.0.0
    typing_extensions

[options.packages.find]
where = src

[options.package_data]
* =
    py.typed
    debugtoolbar/panels/templates/*

[options.extras_require]
tests =
    pytest
    mypy
    pyramid_mako
    # Pyramid still uses pkg_resources.
    setuptools<82.0.0
    webob

[flake8]
application_import_names = pyramid_formencode_classic
import_order_style = appnexus
max_line_length = 88

per-file-ignores =
    src/pyramid_formencode_classic/__init__.py: E501
    src/pyramid_formencode_classic/api.py: E501
    src/pyramid_formencode_classic/exceptions.py: E501
    src/pyramid_formencode_classic/formatters.py: E501
    src/pyramid_formencode_classic/debugtoolbar/panels/formencode_classic.py: E501
    src/pyramid_formencode_classic/objects.py: E501
    src/pyramid_formencode_classic/utils.py: E501
    tests/test_debug.py:E501
    tests/test_core.py:W293,E501,E722
    tests/test_validators.py:E501

[tox:tox]
envlist =
    lint,
    mypy,
    py37,py38,py39,py310,py311,py312,py313,py314,py315

[testenv]
commands =
    python --version
    pytest {posargs:}
extras =
    tests


[testenv:cover]
coverage_report = python -m coverage report
common_coverage_report_commands =
    {[testenv:cover]coverage_report} --fail-under 99 --include pyramid_formencode_classic/*
